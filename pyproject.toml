[project]
name = "anonxmusic"
version = "3.0.3"
description = "Telegram Group Calls Streaming bot with some useful features."
readme = ".github/README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.14.3",
    "apscheduler==3.11.3",
    "kurigram==2.2.24",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pymongo==4.17.0",
    "pytgcrypto==1.2.12",
    "py-tgcalls==3.0.0.dev4",
    "py-yt-search==0.7.3",
    "python-dotenv==1.2.2",
    "yt-dlp[default]>=2026.8.19",
    "numpy==2.2.6",
]

[tool.uv]
prerelease = "allow"
