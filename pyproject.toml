description = "Telegram Group Calls Streaming bot with some useful features."
readme = ".github/README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp~=3.14.3",
    "kurigram==2.2.24",
    "pillow~=12.3.0",
    "psutil~=7.2.2",
    "py-tgcalls==3.0.0.dev4",
    "py-yt-search~=0.6.2",
    "pymongo>=4.16.0",
    "pytgcrypto>=1.2.12",
    "python-dotenv==1.2.3",
    "yt-dlp[default]>=2026.7.4",
    "numpy==2.2.6",
    "aiofiles==25.1.0",
]
